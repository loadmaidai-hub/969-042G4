<head>

  <style>
    :root {
      --primary: #4338CA;
      --secondary: #059669;
      --accent-amber: #D97706;
      --accent-cyan: #0284C7;
      --dark: #1E293B;
      --light-bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --danger: #DC2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif !important; }
    body {
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.2rem;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      border-radius: 24px;
      padding: 2.2rem;
      box-shadow: 0 12px 30px rgba(67, 56, 202, 0.15);
      border-top: 6px solid var(--primary);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      background: #EEF2FF;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      margin-bottom: 0.6rem;
    }

    h1 { font-size: 1.65rem; font-weight: 700; color: var(--dark); margin-bottom: 0.3rem; }
    p.subtitle { font-size: 0.95rem; color: #64748B; margin-bottom: 1.5rem; }

    .radar-box {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 1rem auto 1.5rem;
      border-radius: 50%;
      background: rgba(2, 132, 199, 0.08);
      border: 2px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .radar-sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 70%, rgba(2, 132, 199, 0.45) 100%);
      animation: sweep 2s linear infinite;
    }
    @keyframes sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .radar-icon { font-size: 2.2rem; z-index: 2; }

    .form-group { margin-bottom: 1.1rem; text-align: left; }
    label { display: block; font-weight: 500; margin-bottom: 0.4rem; font-size: 0.95rem; }
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(67, 56, 202, 0.2);
    }
    .btn:hover { background: #3730A3; transform: translateY(-1px); }
    .btn-secondary { background: var(--secondary); }

    .geo-status {
      font-size: 0.88rem;
      padding: 0.7rem;
      border-radius: 10px;
      background: #F1F5F9;
      color: #475569;
      margin-bottom: 1.2rem;
      border: 1px dashed #CBD5E1;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #E2E8F0;
    }
    .timer { font-weight: 700; color: var(--accent-amber); font-size: 1.15rem; }
    .score-badge { background: #ECFDF5; color: var(--secondary); padding: 0.3rem 0.8rem; border-radius: 8px; font-weight: 600; }
    .question-box { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; text-align: left; min-height: 3.5rem; }
    .options-grid { display: flex; flex-direction: column; gap: 0.8rem; }
    .opt-btn {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      padding: 1rem;
      border-radius: 14px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .opt-btn:hover { border-color: var(--primary); background: #EEF2FF; }
    .opt-btn.correct { background: #DEF7EC; border-color: var(--secondary); color: #03543F; font-weight: 600; }
    .opt-btn.wrong { background: #FDE8E8; border-color: var(--danger); color: #9B1C1C; }

    .leaderboard-box {
      background: #F8FAFC;
      border-radius: 16px;
      padding: 1rem;
      margin: 1.2rem 0;
      border: 1.5px solid #E2E8F0;
      max-height: 240px;
      overflow-y: auto;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0.8rem;
      margin-bottom: 0.4rem;
      border-radius: 10px;
      background: white;
      border: 1px solid #E2E8F0;
      font-size: 0.9rem;
    }
    .rank-item.my-rank { background: #EEF2FF; border: 1.5px solid var(--primary); font-weight: 600; }

    .hidden { display: none !important; }
  </style>
</head>

    let currentQ = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 15;
    let studentData = { id: '', name: '', score: 0, timestamp: '', distance: 0, ip: '' };

    function autoFillName() {
      const id = document.getElementById('stuId').value.trim();
      const nameInput = document.getElementById('stuName');

      if (studentRoster[id]) {
        nameInput.value = studentRoster[id];
        nameInput.readOnly = true;
        nameInput.style.backgroundColor = "#F1F5F9";
        return true;
      } else {
        nameInput.value = "";
        nameInput.readOnly = false;
        nameInput.style.backgroundColor = "#FFFFFF";
        return false;
      }
    }

    function handleIdEnter(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        const isFound = autoFillName();
        if (isFound) {
          document.querySelector("#step-register .btn").focus();
        } else {
          alert("❌ ไม่พบรหัสนักศึกษานี้ในระบบรายวิชา กรุณาตรวจสอบอีกครั้งครับ");
        }
      }
    }

    function verifyRoomPinLive() {
      const pinInput = document.getElementById('roomPin');
      const feedback = document.getElementById('pinFeedback');
      const val = pinInput.value.trim();

      if (val.length < 4) {
        pinInput.style.borderColor = "#CBD5E1";
        pinInput.style.backgroundColor = "white";
        feedback.innerText = "";
        return false;
      }

      if (val === currentCloudPIN) {
        pinInput.style.borderColor = "var(--secondary)";
        pinInput.style.backgroundColor = "#DEF7EC";
        feedback.style.color = "var(--secondary)";
        feedback.innerText = "✓ รหัสห้องถูกต้อง พร้อมสแกนพิกัด";
        return true;
      } else {
        pinInput.style.borderColor = "var(--danger)";
        pinInput.style.backgroundColor = "#FDE8E8";
        feedback.style.color = "var(--danger)";
        feedback.innerText = "✗ รหัสไม่ถูกต้องหรือหมดอายุแล้ว (รีเซ็ตทุก 2 นาที)";
        return false;
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function sanitizeKey(key) {
      return key.replace(/[\.\#\$\[\]\/]/g, "_");
    }

    function verifyAndStart() {
      const pin = document.getElementById('roomPin').value.trim();
      const id = document.getElementById('stuId').value.trim();
      const name = document.getElementById('stuName').value.trim();

      if (pin !== currentCloudPIN) {
        alert("❌ รหัส Room PIN ไม่ถูกต้องหรือหมดอายุแล้ว! (ดูรหัสสดบนจอหน้าห้อง)");
        return;
      }
      if (!id || !name) {
        alert("กรุณากรอกรหัสนักศึกษาและตรวจสอบชื่อให้ครบถ้วน");
        return;
      }

      const safeSession = sanitizeKey(activeSessionKey);

      // เช็คการส่งซ้ำบน Cloud
      fetch(`${FIREBASE_DB_URL}attendance/${safeSession}/${id}.json`)
        .then(res => res.json())
        .then(record => {
          if (record) {
            alert(`⚠️ รหัสนักศึกษานี้ได้ทำการเช็คชื่อใน ${activeSessionKey} ไปแล้ว!`);
            return;
          }
          startGPSVerification(id, name);
        });
    }

    function startGPSVerification(id, name) {
      const statusBox = document.getElementById('geoStatus');
      statusBox.innerText = "📡 กำลังเชื่อมต่อดาวเทียม GPS เพื่อยืนยันพิกัดห้องเรียน...";

      if (!navigator.geolocation) {
        alert("อุปกรณ์ของคุณไม่รองรับ Geolocation");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          const distance = calculateDistance(userLat, userLng, TARGET_LOCATION.lat, TARGET_LOCATION.lng);
          
          studentData.distance = Math.round(distance);

          if (distance > TARGET_LOCATION.radiusMeters) {
            statusBox.innerHTML = `❌ <strong>คุณอยู่นอกพื้นที่ห้องเรียน!</strong> (ห่างไป ${Math.round(distance)} ม.) ระบบไม่อนุญาตให้เช็คชื่อแทนกัน`;
            statusBox.style.color = "var(--danger)";
            return;
          }

          studentData.id = id;
          studentData.name = name;
          studentData.timestamp = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
          studentData.ip = clientIP;

          document.getElementById('step-register').classList.add('hidden');
          document.getElementById('step-quiz').classList.remove('hidden');
          document.getElementById('stuInfoDisplay').innerText = `${id} : ${name}`;
          loadQuestion();
        },
        (error) => {
          statusBox.innerText = "❌ กรุณากด 'อนุญาต (Allow)' ให้เข้าถึงตำแหน่ง GPS ของอุปกรณ์";
          statusBox.style.color = "var(--danger)";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function loadQuestion() {
      if (currentQ >= questions.length) {
        finishGame();
        return;
      }

      clearInterval(timerInterval);
      timeLeft = 15;
      document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
      document.getElementById('qCountDisplay').innerText = `คำถาม ${currentQ + 1}/${questions.length}`;
      document.getElementById('scoreDisplay').innerText = `คะแนนสะสม: ${score}`;
      
      const q = questions[currentQ];
      document.getElementById('questionText').innerText = q.q;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          highlightAndNext(-1, null);
        }
      }, 1000);
    }

    function selectOption(selectedIndex, btnElement) {
      clearInterval(timerInterval);
      highlightAndNext(selectedIndex, btnElement);
    }

    function highlightAndNext(selectedIndex, btnElement) {
      const correctIndex = questions[currentQ].answer;
      const allBtns = document.querySelectorAll('.opt-btn');

      allBtns.forEach((b, idx) => {
        b.disabled = true;
        if (idx === correctIndex) b.classList.add('correct');
      });

      if (selectedIndex === correctIndex) {
        score += (10 + timeLeft);
      } else if (btnElement) {
        btnElement.classList.add('wrong');
      }

      document.getElementById('scoreDisplay').innerText = `คะแนนสะสม: ${score}`;

      setTimeout(() => {
        currentQ++;
        loadQuestion();
      }, 1200);
    }

    function finishGame() {
  studentData.score = score; // บันทึกคะแนน
  const safeSession = sanitizeKey(activeSessionKey);

  // ส่งขึ้น Firebase
  fetch(`${FIREBASE_DB_URL}attendance/${safeSession}/${studentData.id}.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(studentData)
  })
  .then(() => fetchLeaderboard(safeSession))
  .catch(err => console.error("Send score error:", err));

  document.getElementById('step-quiz').classList.add('hidden');
  document.getElementById('step-result').classList.remove('hidden');
  document.getElementById('myFinalScore').innerText = `${score} แต้ม`;
}

    function fetchLeaderboard(safeSession) {
      fetch(`${FIREBASE_DB_URL}attendance/${safeSession}.json`)
        .then(res => res.json())
        .then(records => {
          if (!records) return;
          const list = Object.values(records);
          list.sort((a, b) => b.score - a.score);
          renderLeaderboard(list);
        });
    }

    function renderLeaderboard(logs) {
      const listContainer = document.getElementById('leaderboardList');
      listContainer.innerHTML = '';

      logs.slice(0, 10).forEach((item, index) => {
        const div = document.createElement('div');
        const isMe = item.id === studentData.id;
        div.className = `rank-item ${isMe ? 'my-rank' : ''}`;

        let medal = `#${index + 1}`;
        if (index === 0) medal = '🥇';
        if (index === 1) medal = '🥈';
        if (index === 2) medal = '🥉';

        div.innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <span style="width:24px; font-weight:700;">${medal}</span>
            <span>${item.name} ${isMe ? '<small>(คุณ)</small>' : ''}</span>
          </div>
          <span style="font-weight: 700; color: var(--primary);">${item.score} แต้ม</span>
        `;
        listContainer.appendChild(div);
      });
    }
